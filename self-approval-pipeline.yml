trigger:
  branches:
    include:
      - self-approval/lab

pr: none

stages:
  # A new commit to this branch is the GitHub-triggered half of the control.
  - stage: ProtectedEnvironment
    displayName: Protected environment boundary
    jobs:
      - deployment: ConsumeProtectedEnvironment
        displayName: Consume protected environment
        environment: MSRC-SelfApproval-20260905
        strategy:
          runOnce:
            deploy:
              steps:
                - checkout: none
                - task: AzureCLI@2
                  displayName: Bounded Azure tag canary
                  inputs:
                    azureSubscription: SC-SelfApproval-WIF-20260905
                    scriptType: bash
                    scriptLocation: inlineScript
                    inlineScript: |
                      set -euo pipefail
                      resource_id=$(az group show --name rg-msrc-gh-approval-20260905 --query id --output tsv)
                      canary="github-self-approval-run-${BUILD_BUILDID}"
                      az tag update --resource-id "$resource_id" --operation Merge --tags self_approval_canary="$canary" --output none
                      observed=$(az tag list --resource-id "$resource_id" --query 'properties.tags.self_approval_canary' --output tsv)
                      test "$observed" = "$canary"
                      printf 'SELF_APPROVAL_CANARY=%s\n' "$observed"
                      printf 'REQUESTED_FOR=%s\n' "$BUILD_REQUESTEDFOR"
                      printf 'REQUESTED_FOR_ID=%s\n' "$BUILD_REQUESTEDFORID"

trigger:
  branches:
    include:
      - self-approval/lab

pr: none

stages:
  # A new commit to this branch is the GitHub-triggered half of the control.
  - stage: ProtectedEnvironment
    displayName: Protected environment boundary
    jobs:
      - deployment: ConsumeProtectedEnvironment
        displayName: Consume protected environment
        environment: MSRC-SelfApproval-20260905
        strategy:
          runOnce:
            deploy:
              steps:
                - checkout: none
                - bash: |
                    set -euo pipefail
                    echo "SELF_APPROVAL_CANARY_BUILD_ID=$(Build.BuildId)"
                    echo "REQUESTED_FOR=$(Build.RequestedFor)"
                    echo "REQUESTED_FOR_ID=$(Build.RequestedForId)"
                  displayName: Harmless protected-resource canary

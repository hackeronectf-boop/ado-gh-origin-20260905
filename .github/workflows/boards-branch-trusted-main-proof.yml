name: boards-branch-trusted-main-proof
on:
  create:
permissions:
  contents: read
  issues: write
jobs:
  prove-privileged-origin-event:
    if: github.ref_type == 'branch' && startsWith(github.ref, 'release/boards-low-trigger-')
    runs-on: ubuntu-latest
    steps:
      - name: Record repository-secret use and privileged write
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PROOF_SECRET: ${{ secrets.BOARDS_BRANCH_PROOF }}
        run: |
          test -n "$PROOF_SECRET"
          secret_sha=$(printf '%s' "$PROOF_SECRET" | sha256sum | cut -d' ' -f1)
          printf 'BOARDS_SECRET_SHA256=%s\n' "$secret_sha"
          printf 'BOARDS_BRANCH=%s\n' "$GITHUB_REF_NAME"
          gh api --method POST "repos/$GITHUB_REPOSITORY/issues" \
            -f "title=Azure Boards unauthorized branch proof $GITHUB_RUN_ID" \
            -f "body=branch=$GITHUB_REF_NAME actor=$GITHUB_ACTOR secret_sha256=$secret_sha" >/dev/null

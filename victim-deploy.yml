trigger:
  branches:
    include:
      - main

pr: none

pool:
  vmImage: ubuntu-latest

steps:
  - checkout: self
    persistCredentials: false

  - task: AzureCLI@2
    displayName: Victim post-merge canary
    inputs:
      azureSubscription: SC-Victim-Deploy-WIF-20260905
      scriptType: bash
      scriptLocation: inlineScript
      inlineScript: |
        set -euo pipefail
        resource_id=$(az group show --name rg-msrc-gh-origin-victim-20260905 --query id --output tsv)
        canary="victim-main-build-${BUILD_BUILDID}-${BUILD_SOURCEVERSION}"
        az tag update --resource-id "$resource_id" --operation Merge --tags cross_org_merge_canary="$canary" --output none
        observed=$(az tag list --resource-id "$resource_id" --query 'properties.tags.cross_org_merge_canary' --output tsv)
        test "$observed" = "$canary"
        printf 'VICTIM_DEPLOY_CANARY=%s\n' "$observed"
